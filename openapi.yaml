components:
  responses:
    DEFAULT_ERROR:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Default error response
    UNPROCESSABLE_CONTENT:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unprocessable Content
  schemas:
    AllocationItem:
      additionalProperties: false
      properties:
        name:
          example: stock
          type: string
        value:
          example: 4220000
          minimum: 0.0
          type: number
        weight:
          example: 0.72
          maximum: 1.0
          minimum: 0.0
          type: number
      required:
      - name
      - value
      - weight
      type: object
    AssetInfo:
      additionalProperties: false
      properties:
        asset_id:
          description: Asset ID
          example: 1
          minimum: 1
          type: integer
        currency:
          description: 通貨
          example: JPY
          type: string
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        symbol:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
        type:
          description: Asset type
          example: stock
          maxLength: 20
          type: string
      required:
      - asset_id
      - currency
      - name
      - symbol
      - type
      type: object
    AuthPortfolio:
      additionalProperties: false
      properties:
        base_currency:
          example: JPY
          type: string
        name:
          example: Main Portfolio
          type: string
        portfolio_id:
          example: 1
          type: integer
      required:
      - base_currency
      - name
      - portfolio_id
      type: object
    AuthResponse:
      additionalProperties: false
      properties:
        access_token:
          example: mock-access-token-101
          type: string
        portfolio:
          $ref: '#/components/schemas/AuthPortfolio'
        token_type:
          example: bearer
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
      - access_token
      - portfolio
      - token_type
      - user
      type: object
    AuthUser:
      additionalProperties: false
      properties:
        email:
          example: user@example.com
          format: email
          type: string
        user_id:
          example: 101
          type: integer
      required:
      - email
      - user_id
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          description: Error code
          type: integer
        errors:
          additionalProperties: {}
          description: Errors
          type: object
        message:
          description: Error message
          type: string
        status:
          description: Error name
          type: string
      type: object
    Holding:
      additionalProperties: false
      properties:
        asset_id:
          description: Asset ID
          example: 1
          minimum: 1
          type: integer
        average_purchase_price:
          description: 平均取得単価
          example: 1095.8
          minimum: 0.0
          type: number
        currency:
          description: 通貨
          example: JPY
          type: string
        current_price:
          description: Yahoo Finance 由来の市場価格。Supabase holdings には保存しない。
          example: 2980.5
          minimum: 0.0
          type: number
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        portfolio_id:
          example: 1
          minimum: 1
          type: integer
        quantity:
          description: Current holding quantity
          example: 8.5
          minimum: 0.0
          type: number
        symbol:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - asset_id
      - average_purchase_price
      - currency
      - current_price
      - name
      - portfolio_id
      - quantity
      - symbol
      - user_id
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          example: user@example.com
          format: email
          type: string
        password:
          example: password123
          type: string
          writeOnly: true
      required:
      - email
      - password
      type: object
    LogoutResponse:
      additionalProperties: false
      properties:
        message:
          example: Logged out
          type: string
      required:
      - message
      type: object
    PaginationMetadata:
      additionalProperties: false
      properties:
        first_page:
          type: integer
        last_page:
          type: integer
        next_page:
          type: integer
        page:
          type: integer
        previous_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    PerformanceGraph:
      additionalProperties: false
      properties:
        currency:
          example: JPY
          type: string
        interval:
          enum:
          - 1d
          - 1wk
          - 1mo
          example: 1d
        points:
          items:
            $ref: '#/components/schemas/PerformanceGraphPoint'
          type: array
        portfolio_id:
          example: 1
          minimum: 1
          type: integer
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - currency
      - interval
      - points
      - portfolio_id
      - user_id
      type: object
    PerformanceGraphPoint:
      additionalProperties: false
      properties:
        date:
          example: '2026-07-28'
          format: date
          type: string
        total_market_value:
          example: 4220000
          minimum: 0.0
          type: number
        total_purchase_value:
          example: 3901250
          minimum: 0.0
          type: number
        unrealized_gain_loss:
          example: 318750
          type: number
      required:
      - date
      - total_market_value
      - total_purchase_value
      - unrealized_gain_loss
      type: object
    Portfolio:
      additionalProperties: false
      properties:
        cash_balance:
          default: 0.0
          description: Mock-only cash value; current Supabase schema has no cash balance
            column
          example: 1000000
          minimum: 0.0
          type: number
        currency:
          example: JPY
          type: string
        name:
          example: Main Portfolio
          type: string
        portfolio_id:
          example: 1
          minimum: 1
          type: integer
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - currency
      - name
      - portfolio_id
      - user_id
      type: object
    PortfolioAllocation:
      additionalProperties: false
      properties:
        by_asset:
          items:
            $ref: '#/components/schemas/AllocationItem'
          type: array
        by_asset_type:
          items:
            $ref: '#/components/schemas/AllocationItem'
          type: array
        by_currency:
          items:
            $ref: '#/components/schemas/AllocationItem'
          type: array
      required:
      - by_asset
      - by_asset_type
      - by_currency
      type: object
    PortfolioCreate:
      additionalProperties: false
      properties:
        cash_balance:
          default: 0.0
          description: Mock-only cash value; current Supabase schema has no cash balance
            column
          example: 1000000
          minimum: 0.0
          type: number
        currency:
          example: JPY
          type: string
        name:
          example: Main Portfolio
          type: string
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - currency
      - name
      - user_id
      type: object
    PortfolioSummary:
      additionalProperties: false
      properties:
        cash_balance:
          description: Mock-only cash value; current Supabase schema has no cash balance
            column
          example: 1250000
          minimum: 0.0
          type: number
        currency:
          example: JPY
          type: string
        portfolio_id:
          example: 1
          type: integer
        total_asset_value:
          example: 5470000
          minimum: 0.0
          type: number
        total_market_value:
          example: 4220000
          minimum: 0.0
          type: number
        total_purchase_value:
          example: 3901250
          minimum: 0.0
          type: number
        unrealized_gain_loss:
          example: 318750
          type: number
        user_id:
          example: 101
          type: integer
      required:
      - cash_balance
      - currency
      - portfolio_id
      - total_asset_value
      - total_market_value
      - total_purchase_value
      - unrealized_gain_loss
      - user_id
      type: object
    PriceHistoryItem:
      additionalProperties: false
      properties:
        close:
          example: 2980.5
          minimum: 0.0
          type: number
        date:
          example: '2026-07-28'
          format: date
          type: string
        high:
          example: 3000.0
          minimum: 0.0
          type: number
        low:
          example: 2920.0
          minimum: 0.0
          type: number
        open:
          example: 2950.0
          minimum: 0.0
          type: number
        volume:
          example: 1200000
          minimum: 0
          type: integer
      required:
      - close
      - date
      - high
      - low
      - open
      - volume
      type: object
    SignupRequest:
      additionalProperties: false
      properties:
        base_currency:
          example: JPY
          type: string
        email:
          example: user@example.com
          format: email
          type: string
        password:
          example: password123
          minLength: 8
          type: string
          writeOnly: true
        portfolio_name:
          example: Main Portfolio
          type: string
      required:
      - base_currency
      - email
      - password
      - portfolio_name
      type: object
    Transaction:
      additionalProperties: false
      properties:
        asset_id:
          example: 1
          minimum: 1
          type: integer
        date:
          example: '2026-05-26T18:00:00'
          format: date-time
          type: string
        fees:
          default: 0.0
          example: 0.0
          minimum: 0.0
          type: number
        portfolio_id:
          example: 1
          minimum: 1
          type: integer
        price:
          example: 2980.5
          minimum: 0.0
          type: number
        quantity:
          example: 5.4
          exclusiveMinimum: true
          minimum: 0.0
          type: number
        transaction_id:
          example: 1
          minimum: 1
          type: integer
        transaction_type:
          enum:
          - buy
          - sell
          example: buy
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - asset_id
      - date
      - portfolio_id
      - price
      - quantity
      - transaction_id
      - transaction_type
      - user_id
      type: object
    TransactionBatchCreate:
      additionalProperties: false
      properties:
        transactions:
          items:
            $ref: '#/components/schemas/TransactionItem'
          minItems: 1
          type: array
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - transactions
      - user_id
      type: object
    TransactionCreate:
      additionalProperties: false
      properties:
        asset_id:
          example: 1
          minimum: 1
          type: integer
        date:
          example: '2026-05-26T18:00:00'
          format: date-time
          type: string
        fees:
          default: 0.0
          example: 0.0
          minimum: 0.0
          type: number
        price:
          example: 2980.5
          minimum: 0.0
          type: number
        quantity:
          example: 5.4
          exclusiveMinimum: true
          minimum: 0.0
          type: number
        transaction_type:
          enum:
          - buy
          - sell
          example: buy
        user_id:
          example: 101
          minimum: 1
          type: integer
      required:
      - asset_id
      - date
      - price
      - quantity
      - transaction_type
      - user_id
      type: object
    TransactionItem:
      additionalProperties: false
      properties:
        asset_id:
          example: 1
          minimum: 1
          type: integer
        date:
          example: '2026-05-26T18:00:00'
          format: date-time
          type: string
        fees:
          default: 0.0
          example: 0.0
          minimum: 0.0
          type: number
        price:
          example: 2980.5
          minimum: 0.0
          type: number
        quantity:
          example: 5.4
          exclusiveMinimum: true
          minimum: 0.0
          type: number
        transaction_type:
          enum:
          - buy
          - sell
          example: buy
      required:
      - asset_id
      - date
      - price
      - quantity
      - transaction_type
      type: object
info:
  contact:
    name: Portfolio Manager Team
  description: '個人向けポートフォリオ管理 API。


    - `auth` … ユーザー登録、ログイン、ログアウト

    - `portfolio` … ポートフォリオの作成、サマリー、保有残高、資産配分、推移

    - `assets` … 資産マスタと Yahoo Finance の市場価格

    - `transactions` … 売買の取引履歴


    実際の証券発注は行わない。売買は取引履歴の記録と保有残高の更新だけを行う。


    private なデータは `user_id` で絞り込む。モック／開発中は private な GET API に `user_id` をクエリパラメータで渡す。本番ではログイン情報から
    `user_id` を解決する想定。公開の資産・市場データに `user_id` は不要。'
  title: Portfolio Manager API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/assets/{asset_id}/:
    get:
      description: '公開データなので `user_id` は不要。保有数量や取得価額は

        `GET /portfolios/{portfolio_id}/holdings` で取得する。'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInfo'
          description: OK
        '404':
          description: The specified asset does not exist
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 資産マスタ情報を取得する。
      tags:
      - assets
    parameters:
    - description: Asset ID
      in: path
      name: asset_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/assets/{asset_id}/price-history:
    get:
      description: '`asset_master.symbol` を使って Yahoo Finance の履歴を取得するか、

        `asset_data_history` のキャッシュ済み終値を読む想定。'
      parameters:
      - in: query
        name: start_date
        required: false
        schema:
          example: '2026-01-01'
          format: date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          example: '2026-07-28'
          format: date
          type: string
      - in: query
        name: interval
        required: false
        schema:
          default: 1d
          example: 1d
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PriceHistoryItem'
                type: array
          description: OK
        '404':
          description: The specified asset does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 過去の市場価格を取得する。
      tags:
      - assets
    parameters:
    - description: Asset ID
      in: path
      name: asset_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/auth/login:
    post:
      description: '本番では Supabase Auth の signInWithPassword を使用し、access token を

        private API の認証に使う想定。'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: OK
        '401':
          description: Invalid email or password
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ログインを行う。
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 本番ではクライアント側で token/session を破棄する想定。
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: OK
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ログアウトを行う。
      tags:
      - auth
  /api/v1/auth/signup:
    post:
      description: 'Mock/設計版ではユーザーとデフォルトポートフォリオを作成する想定。

        本番では Supabase Auth の signUp を使用し、password は public schema に

        保存しない。'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: Created
        '409':
          description: Email already exists
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ユーザー登録を行う。
      tags:
      - auth
  /api/v1/portfolios/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
          description: Created
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ポートフォリオを作成する。
      tags:
      - portfolio
  /api/v1/portfolios/{portfolio_id}/allocation:
    get:
      description: '資産種別・通貨・銘柄それぞれの内訳を返す。評価額計算の市場価格は

        Yahoo Finance から取得する想定。'
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          example: 101
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioAllocation'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 資産配分を取得する。
      tags:
      - portfolio
    parameters:
    - description: Portfolio ID
      in: path
      name: portfolio_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/portfolios/{portfolio_id}/holdings:
    get:
      description: '1 つのポートフォリオに含まれる複数の資産を返す。`current_price` は

        Yahoo Finance 由来の市場価格で、Supabase holdings には保存しない。'
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          example: 101
          minimum: 1
          type: integer
      - description: 特定銘柄の保有残高だけを返す
        in: query
        name: asset_id
        required: false
        schema:
          example: 1
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Holding'
                type: array
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 保有残高一覧を取得する。
      tags:
      - portfolio
    parameters:
    - description: Portfolio ID
      in: path
      name: portfolio_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/portfolios/{portfolio_id}/performance:
    get:
      description: '取引履歴から日付ごとの保有残高を復元し、`asset_data_history` または

        Yahoo Finance の価格データで評価額と含み損益を計算する想定。'
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          example: 101
          minimum: 1
          type: integer
      - in: query
        name: start_date
        required: false
        schema:
          example: '2026-07-26'
          format: date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          example: '2026-07-28'
          format: date
          type: string
      - description: グラフの粒度
        in: query
        name: interval
        required: false
        schema:
          default: 1d
          enum:
          - 1d
          - 1wk
          - 1mo
          example: 1d
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceGraph'
          description: OK
        '400':
          description: start_date must be before or equal to end_date
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ポートフォリオ推移グラフを取得する。
      tags:
      - portfolio
    parameters:
    - description: Portfolio ID
      in: path
      name: portfolio_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/portfolios/{portfolio_id}/summary:
    get:
      description: '取得価額・評価額・総資産・含み損益を返す。評価額の市場価格は

        Yahoo Finance または `asset_data_history` から取得する想定で、

        `holdings` には保存しない。'
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          example: 101
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: ポートフォリオサマリーを取得する。
      tags:
      - portfolio
    parameters:
    - description: Portfolio ID
      in: path
      name: portfolio_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/portfolios/{portfolio_id}/transactions:
    get:
      description: '`asset_id` / `start_date` / `end_date` で絞り込める。

        日付はどちらも指定日を含む（inclusive）。'
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          example: 101
          minimum: 1
          type: integer
      - description: 特定銘柄の取引だけを返す
        in: query
        name: asset_id
        required: false
        schema:
          example: 1
          minimum: 1
          type: integer
      - description: この日付以降（当日を含む）の取引を返す
        in: query
        name: start_date
        required: false
        schema:
          example: '2026-01-01'
          format: date
          type: string
      - description: この日付以前（当日を含む）の取引を返す
        in: query
        name: end_date
        required: false
        schema:
          example: '2026-12-31'
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Transaction'
                type: array
          description: OK
        '404':
