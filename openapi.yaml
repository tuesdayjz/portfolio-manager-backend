components:
  responses:
    DEFAULT_ERROR:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Default error response
    UNPROCESSABLE_CONTENT:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unprocessable Content
  schemas:
    AllocationItem:
      additionalProperties: false
      properties:
        category:
          description: 集計基準ごとの区分名（資産クラス名・通貨コード・銘柄名・セクター名）
          example: stock
          type: string
        holdings_count:
          description: この区分に含まれる保有銘柄数
          example: 12
          minimum: 0
          type: integer
        value:
          example: 4220000
          minimum: 0.0
          type: number
        weight:
          example: 0.72
          maximum: 1.0
          minimum: 0.0
          type: number
      required:
      - category
      - holdings_count
      - value
      - weight
      type: object
    AssetInfo:
      additionalProperties: false
      properties:
        asset_id:
          description: Asset ID
          example: 1
          minimum: 1
          type: integer
        currency:
          description: 通貨
          example: JPY
          type: string
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        symbol:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
        type:
          description: Asset type
          example: stock
          maxLength: 20
          type: string
      required:
      - asset_id
      - currency
      - name
      - symbol
      - type
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          description: Error code
          type: integer
        errors:
          additionalProperties: {}
          description: Errors
          type: object
        message:
          description: Error message
          type: string
        status:
          description: Error name
          type: string
      type: object
    Holding:
      additionalProperties: false
      properties:
        asset_type:
          description: 資産クラス。配分の `group_by=asset_type` と同じ区分。
          example: stock
          maxLength: 20
          type: string
        average_purchase_price:
          description: 平均取得単価
          example: 1095.8
          minimum: 0.0
          type: number
        currency:
          description: 通貨
          example: USD
          type: string
        current_price:
          description: Yahoo Finance 由来の市場価格。Supabase holdings には保存しない。
          example: 2980.5
          minimum: 0.0
          type: number
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        quantity:
          description: Current holding quantity
          example: 8.5
          minimum: 0.0
          type: number
        ticker:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
        today_return_percent:
          description: 前日終値からの騰落率（％）。下落なら負。
          example: 1.8
          type: number
        total_market_value:
          description: 評価額（quantity × current_price）
          example: 25334.25
          minimum: 0.0
          type: number
        total_purchase_price:
          description: 合計取得価額
          example: 9314.3
          minimum: 0.0
          type: number
        total_return_percent:
          description: 平均取得単価に対する損益率（％）。下落なら負。
          example: 12.4
          type: number
      required:
      - asset_type
      - average_purchase_price
      - currency
      - current_price
      - name
      - quantity
      - ticker
      - today_return_percent
      - total_market_value
      - total_purchase_price
      - total_return_percent
      type: object
    HoldingsPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Holding'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
        totals:
          $ref: '#/components/schemas/HoldingsTotal'
      required:
      - items
      - pagination
      - totals
      type: object
    HoldingsTotal:
      additionalProperties: false
      properties:
        currency:
          example: USD
          type: string
        day_change:
          description: 前日終値からの評価損益の変化額の合計。下落なら負。
          example: 42150
          type: number
        day_change_percent:
          description: 前日終値の評価額合計に対する騰落率（％）。下落なら負。
          example: 1.01
          type: number
        market_value:
          description: 評価額の合計
          example: 4220000
          minimum: 0.0
          type: number
      required:
      - currency
      - day_change
      - day_change_percent
      - market_value
      type: object
    Pagination:
      additionalProperties: false
      properties:
        page:
          example: 1
          minimum: 1
          type: integer
        per_page:
          example: 5
          minimum: 1
          type: integer
        total_items:
          description: フィルタ適用後の総件数
          example: 24
          minimum: 0
          type: integer
        total_pages:
          example: 5
          minimum: 0
          type: integer
      required:
      - page
      - per_page
      - total_items
      - total_pages
      type: object
    PaginationMetadata:
      additionalProperties: false
      properties:
        first_page:
          type: integer
        last_page:
          type: integer
        next_page:
          type: integer
        page:
          type: integer
        previous_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    PerformanceChange:
      additionalProperties: false
      properties:
        amount:
          description: 損益額
          example: 149832.5
          type: number
        percent:
          description: 損益率（％）
          example: 12.4
          type: number
      required:
      - amount
      - percent
      type: object
    PerformanceGraph:
      additionalProperties: false
      properties:
        asset_type:
          description: 絞り込みに使った資産クラス。全資産なら `all`。
          example: all
          type: string
        currency:
          example: JPY
          type: string
        end_date:
          example: '2026-07-28'
          format: date
          type: string
        interval:
          enum:
          - 1d
          - 1wk
          - 1mo
          example: 1d
        metrics:
          $ref: '#/components/schemas/PerformanceMetrics'
        points:
          items:
            $ref: '#/components/schemas/PerformanceGraphPoint'
          type: array
        range:
          description: 期間セレクタで指定された値。start_date / end_date で直接指定された場合は null。
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - YTD
          - 1y
          - all
          - null
          example: 1y
          nullable: true
        return_1d:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 前日以降の買付・売却を調整した損益
        return_1m:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 1 か月前以降の買付・売却を調整した損益
        return_1w:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 1 週間前以降の買付・売却を調整した損益
        return_1y:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 1 年前以降の買付・売却を調整した損益
        return_3m:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 3 か月前以降の買付・売却を調整した損益
        return_YTD:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 年初以降の買付・売却を調整した損益
        return_total:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 運用開始以降の買付・売却を調整した損益
        start_date:
          example: '2026-01-01'
          format: date
          type: string
      required:
      - asset_type
      - currency
      - end_date
      - interval
      - metrics
      - points
      - return_1d
      - return_1m
      - return_1w
      - return_1y
      - return_3m
      - return_YTD
      - return_total
      - start_date
      type: object
    PerformanceGraphPoint:
      additionalProperties: false
      properties:
        date:
          example: '2026-07-28'
          format: date
          type: string
        total_market_value:
          example: 4220000
          minimum: 0.0
          type: number
      required:
      - date
      - total_market_value
      type: object
    PerformanceMetrics:
      additionalProperties: false
      properties:
        portfolio_value:
          description: 期間終了時点の評価額。現金を含む総資産額。
          example: 1247832.5
          minimum: 0.0
          type: number
        return:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: '`range`（または start_date / end_date）で指定した対象期間の損益。今日の close price
            と対象期間の起点 close price の差分で計算する。'
        today:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 今日の close price と前日の close price の差分で計算する騰落
        total_return:
          allOf:
          - $ref: '#/components/schemas/PerformanceChange'
          description: 運用開始来（全期間）の損益。対象期間の影響を受けない。
      required:
      - portfolio_value
      - return
      - today
      - total_return
      type: object
    PortfolioAllocation:
      additionalProperties: false
      properties:
        as_of:
          description: 配分の計算に使った市場価格の時刻。UI の「Last updated 5 mins ago」の元になる。
          example: '2026-07-30T14:25:00'
          format: date-time
          type: string
        currency:
          description: 評価額の通貨（基準通貨）
          example: JPY
          type: string
        group_by:
          description: 集計基準
          enum:
          - asset_type
          - currency
          - asset
          - sector
          example: asset_type
        items:
          description: '`value` の降順'
          items:
            $ref: '#/components/schemas/AllocationItem'
          type: array
        total_value:
          description: '`items` の value 合計。ドーナツ中央の Total Value。`group_by=sector` では株式ぶんだけの合計になる。'
          example: 5860000
          minimum: 0.0
          type: number
      required:
      - as_of
      - currency
      - group_by
      - items
      - total_value
      type: object
    PortfolioCreate:
      additionalProperties: false
      properties:
        cash_balance:
          default: 1000000.0
          description: Initial cash amount stored as a cash holding with quantity
            1. Defaults to 1000000 if omitted.
          example: 1000000
          minimum: 0.0
          type: number
        currency:
          default: USD
          example: USD
          type: string
      type: object
    PortfolioCreateConflict:
      additionalProperties: false
      properties:
        message:
          example: Portfolio already exists for this user.
          type: string
      required:
      - message
      type: object
    PortfolioCreateResult:
      additionalProperties: false
      properties:
        message:
          example: Portfolio created
          type: string
      required:
      - message
      type: object
    PortfolioSummary:
      additionalProperties: false
      properties:
        cash_balance:
          description: Initial cash amount stored as a cash holding with quantity
            1
          example: 1250000
          minimum: 0.0
          type: number
        currency:
          example: USD
          type: string
        currency_symbol:
          example: $
          type: string
        total_market_value:
          example: 4220000
          minimum: 0.0
          type: number
        total_return_percent:
          description: 取得原価に対する損益率（％）。ヘッダーの Total Return。
          example: 8.17
          type: number
      required:
      - cash_balance
      - currency
      - currency_symbol
      - total_market_value
      - total_return_percent
      type: object
    PriceHistoryItem:
      additionalProperties: false
      properties:
        close:
          example: 2980.5
          minimum: 0.0
          type: number
        date:
          example: '2026-07-28'
          format: date
          type: string
        high:
          example: 3000.0
          minimum: 0.0
          type: number
        low:
          example: 2920.0
          minimum: 0.0
          type: number
        open:
          example: 2950.0
          minimum: 0.0
          type: number
        volume:
          example: 1200000
          minimum: 0
          type: integer
      required:
      - close
      - date
      - high
      - low
      - open
      - volume
      type: object
    Transaction:
      additionalProperties: false
      properties:
        asset_type:
          description: 資産クラス
          example: stock
          maxLength: 20
          type: string
        date:
          description: 約定日時
          example: '2026-05-26T18:00:00'
          format: date-time
          type: string
        executed_price:
          description: 取引通貨建ての最終約定金額
          example: 14902.5
          minimum: 0.0
          type: number
        executed_unit_price:
          description: 取引通貨建ての約定単価
          example: 2980.5
          minimum: 0.0
          type: number
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        symbol:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
      required:
      - asset_type
      - date
      - executed_price
      - executed_unit_price
      - name
      - symbol
      type: object
    TransactionBatchCreate:
      additionalProperties: false
      properties:
        transactions:
          items:
            $ref: '#/components/schemas/TransactionItem'
          minItems: 1
          type: array
      required:
      - transactions
      type: object
    TransactionHistoryItem:
      additionalProperties: false
      properties:
        asset_type:
          description: 資産クラス
          example: stock
          maxLength: 20
          type: string
        date:
          description: 取引日
          example: '2026-05-26'
          format: date
          type: string
        executed_price:
          description: USD 換算後の約定金額（約定単価 × 数量 × FX rate）
          example: 16094.7
          minimum: 0.0
          type: number
        executed_unit_price:
          description: USD 換算後の約定単価（約定単価 × FX rate）
          example: 2980.5
          minimum: 0.0
          type: number
        name:
          description: Asset name
          example: Toyota Motor Corp.
          type: string
        quantity:
          description: 取引数量
          example: 5.4
          minimum: 0.0
          type: number
        realized_pl:
          description: USD 換算後の実現損益。buy は未確定のため null。
          example: 318750
          nullable: true
          type: number
        realized_pl_percent:
          description: USD 換算後の売却前取得原価に対する実現損益率（％）。buy は null。
          example: 11.18
          nullable: true
          type: number
        symbol:
          description: Yahoo Finance symbol
          example: 7203.T
          type: string
        transaction_id:
          description: 取引 id
          example: b93f26c4-66b3-4069-a93a-1f94f1828921
          type: string
        transaction_type:
          enum:
          - buy
          - sell
          example: sell
          type: string
      required:
      - asset_type
      - date
      - executed_price
      - executed_unit_price
      - name
      - quantity
      - realized_pl
      - realized_pl_percent
      - symbol
      - transaction_id
      - transaction_type
      type: object
    TransactionItem:
      additionalProperties: false
      properties:
        name:
          description: Asset name
          example: Toyota Motor Corp.
          maxLength: 200
          minLength: 1
          type: string
        order_type:
          description: Order execution type
          enum:
          - market
          example: market
          type: string
        position:
          description: Position direction
          enum:
          - long
          example: long
          type: string
        trade_date:
          description: Trade date. Defaults to backend today when omitted.
          example: '2026-05-26'
          format: date
          type: string
        price:
          description: Executed unit price. Defaults to live market price when omitted.
          example: 2980.5
          exclusiveMinimum: true
          minimum: 0.0
          type: number
        quantity:
          example: 5
          minimum: 1
          type: integer
        ticker:
          description: Market data ticker
          example: 7203.T
          maxLength: 50
          minLength: 1
          type: string
        transaction_type:
          enum:
          - buy
          - sell
          example: buy
      required:
      - name
      - order_type
      - position
      - quantity
      - ticker
      - transaction_type
      type: object
    TransactionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/TransactionHistoryItem'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
        totals:
          $ref: '#/components/schemas/TransactionTotals'
      required:
      - items
      - pagination
      - totals
      type: object
    TransactionTotals:
      additionalProperties: false
      properties:
        currency:
          example: USD
          type: string
        realized_pl:
          description: USD 換算後の実現損益の合計。損失なら負。
          example: 318750
          type: number
        realized_pl_percent:
          description: 取得原価の合計に対する実現損益率（％）
          example: 11.18
          type: number
      required:
      - currency
      - realized_pl
      - realized_pl_percent
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Supabase access token
      description: 'React が Supabase Auth で取得した access_token を `Authorization: Bearer
        <token>` として送る。'
      scheme: bearer
      type: http
info:
  contact:
    name: Portfolio Manager Team
  description: '個人向けポートフォリオ管理 API。


    - `portfolio` … ポートフォリオの作成、サマリー、保有残高、資産配分、推移

    - `assets` … 資産マスタと市場価格

    - `transactions` … 売買の取引履歴


    実際の証券発注は行わない。売買は取引履歴の記録と保有残高の更新だけを行う。


    private なデータの対象ポートフォリオはログイン情報から解決する。クライアントは `portfolio_id` も `user_id` も送らない。公開の資産・市場データはポートフォリオに紐づかない。'
  title: Portfolio Manager API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/assets/{asset_id}/:
    get:
      deprecated: true
      description: '公開データなので `user_id` は不要。保有数量や取得価額は

        `GET /portfolios/holdings` で取得する。'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInfo'
          description: OK
        '404':
          description: The specified asset does not exist
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 資産マスタ情報を取得する。
      tags:
      - assets
    parameters:
    - description: Asset ID
      in: path
      name: asset_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/assets/{asset_id}/price-history:
    get:
      deprecated: true
      description: '`asset_master.symbol` を使って Yahoo Finance の履歴を取得するか、

        `asset_data_history` のキャッシュ済み終値を読む想定。'
      parameters:
      - in: query
        name: start_date
        required: false
        schema:
          example: '2026-01-01'
          format: date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          example: '2026-07-28'
          format: date
          type: string
      - in: query
        name: interval
        required: false
        schema:
          default: 1d
          example: 1d
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PriceHistoryItem'
                type: array
          description: OK
        '404':
          description: The specified asset does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 過去の市場価格を取得する。
      tags:
      - assets
    parameters:
    - description: Asset ID
      in: path
      name: asset_id
      required: true
      schema:
        example: 1
        minimum: 1
        type: integer
  /api/v1/portfolios/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioCreateResult'
          description: Created
        '409':
          content:
            application/json:
              example:
                message: Portfolio already exists for this user.
              schema:
                $ref: '#/components/schemas/PortfolioCreateConflict'
          description: Portfolio already exists for this user
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: ポートフォリオを作成する。
      tags:
      - portfolio
  /api/v1/portfolios/allocation:
    get:
      description: '`group_by` で指定した 1 つの基準（資産クラス・通貨・銘柄・セクター）で

        集計した内訳を返す。評価額計算の市場価格は Yahoo Finance から取得する。

        `group_by=sector` 以外は cash holding も 1 区分として含める。'
      parameters:
      - description: 集計基準
        in: query
        name: group_by
        required: true
        schema:
          enum:
          - asset_type
          - currency
          - asset
          - sector
          example: asset_type
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioAllocation'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: 資産配分を取得する。
      tags:
      - portfolio
  /api/v1/portfolios/holdings:
    get:
      description: '1 つのポートフォリオに含まれる複数の資産を `items` に、フィルタ適用後の

        全件を集計した合計行を `totals` に入れて返す。`current_price` は

        Yahoo Finance 由来の市場価格で、Supabase holdings には保存しない。'
      parameters:
      - description: 1 始まりのページ番号
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 1
          minimum: 1
          type: integer
      - description: 1 ページあたりの件数
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          example: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: 資産クラスで絞り込む。省略時は全件（UI の `All`）。
        in: query
        name: asset_type
        required: false
        schema:
          default: all
          example: all
          maxLength: 20
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingsPage'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: 保有残高一覧を取得する。
      tags:
      - portfolio
  /api/v1/portfolios/performance:
    get:
      description: '取引履歴から日付ごとの保有残高を復元し、`asset_data_history` の

        close price で日次の評価額を組み立てる。各期間の return は、期間中の

        買付・売却を調整した資産総額の損益と、その投下資産に対する比率で計算する。

        `asset_type` を指定すると、その資産クラスの

        holding だけを集計した推移を返す。現金は評価額に含めず、

        `asset_type=cash` を指定したときだけ残高を系列として返す。'
      parameters:
      - in: query
        name: start_date
        required: false
        schema:
          example: '2026-07-26'
          format: date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          example: '2026-07-28'
          format: date
          type: string
      - description: 期間セレクタ
        in: query
        name: range
        required: false
        schema:
          default: all
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - YTD
          - 1y
          - all
          example: all
      - description: グラフの粒度
        in: query
        name: interval
        required: false
        schema:
          default: 1d
          enum:
          - 1d
          - 1wk
          - 1mo
          example: 1d
      - description: 資産クラスで絞り込む。省略時は全資産（UI の `All`）。現金は `cash` を指定したときだけ集計に含まれる。
        in: query
        name: asset_type
        required: false
        schema:
          default: all
          example: all
          maxLength: 20
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceGraph'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: ポートフォリオ推移グラフを取得する。
      tags:
      - portfolio
  /api/v1/portfolios/summary:
    get:
      description: '現金残高・評価額・損益率を返す。評価額の市場価格は

        Yahoo Finance または `asset_data_history` から取得する想定で、

        `holdings` には保存しない。'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: OK
        '404':
          description: The specified portfolio does not exist
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: ポートフォリオサマリーを取得する。
      tags:
      - portfolio
  /api/v1/portfolios/transactions:
    get:
      description: '`transaction_type` / `asset_type` / `start_date` / `end_date`
        で

        絞り込める。検索や銘柄単位の細かい絞り込みはフロントエンド側で行う。

        日付はどちらも指定日を含む（inclusive）。


        各取引の実現損益は `realized_pl`、絞り込み後の全件の合計は `totals`

        で返す。`buy` は売却時まで損益が確定しないため、どちらも `sell` だけを

        対象にする。'
      parameters:
      - description: 1 始まりのページ番号
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 1
          minimum: 1
          type: integer
      - description: 1 ページあたりの件数
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          example: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: '取引種別で絞り込む。省略時は全件（UI の `Type: All`）。'
        in: query
        name: transaction_type
        required: false
        schema:
          default: all
          enum:
          - all
          - buy
          - sell
          example: all
          type: string
      - description: '資産クラスで絞り込む。省略時は全件（UI の `Asset Class: All`）。'
        in: query
        name: asset_type
        required: false
        schema:
          default: all
          example: all
          maxLength: 20
          type: string
      - description: この日付以降（当日を含む）の取引を返す
        in: query
        name: start_date
        required: false
        schema:
          example: '2026-01-01'
          format: date
          type: string
      - description: この日付以前（当日を含む）の取引を返す
        in: query
        name: end_date
        required: false
        schema:
          example: '2026-12-31'
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
          description: OK
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: 取引履歴を取得する。
      tags:
      - transactions
  /api/v1/transactions:
    post:
      description: 'リクエストでは `asset_id` ではなく `ticker` と `name` で asset を特定する。

        新しい asset を追加する場合は、Yahoo Finance API から取得した情報を

        `asset_master` に登録してから取引を作成する。

        作成した取引の成功確認として、約定日時・銘柄・最終約定金額を返す。'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionItem'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: Created
        '400':
          description: Cannot sell more than current holding
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: 取引を作成する。
      tags:
      - transactions
  /api/v1/transactions/batch:
    post:
      description: '各 item は単件作成と同じ形で、成功時は各取引に対応する約定サマリーを返す。

        全件を検証してから作成するため、1 件でも不正なら何も作成しない。'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBatchCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Transaction'
                type: array
          description: Created
        '400':
          description: One or more transactions are invalid
        '404':
          description: The specified portfolio does not exist
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: 複数の取引を一括作成する。
      tags:
      - transactions
servers:
- description: Current Swagger UI origin
  url: /
tags:
- description: ポートフォリオ関連
  name: portfolio
- description: 資産関連（資産情報、Yahoo Finance価格）
  name: assets
- description: 取引履歴関連
  name: transactions
