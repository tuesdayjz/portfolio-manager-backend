components:
  headers:
    PAGINATION:
      description: Pagination metadata
      schema:
        $ref: '#/components/schemas/PaginationMetadata'
  responses:
    DEFAULT_ERROR:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Default error response
    UNPROCESSABLE_CONTENT:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unprocessable Content
  schemas:
    Asset:
      additionalProperties: false
      properties:
        asset_type:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
          readOnly: true
        created_at:
          format: date-time
          readOnly: true
          type: string
        currency:
          example: JPY
          readOnly: true
          type: string
        exchange:
          example: TSE
          nullable: true
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        name:
          example: トヨタ自動車
          readOnly: true
          type: string
        symbol:
          example: 7203.T
          readOnly: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
      type: object
    AssetCreate:
      additionalProperties: false
      properties:
        asset_type:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
        currency:
          default: JPY
          pattern: ^[A-Z]{3}$
          type: string
        exchange:
          default: null
          example: TSE
          maxLength: 50
          nullable: true
          type: string
        name:
          example: トヨタ自動車
          maxLength: 200
          minLength: 1
          type: string
        symbol:
          description: ティッカー / 証券コード
          example: 7203.T
          maxLength: 32
          minLength: 1
          type: string
      required:
      - asset_type
      - name
      - symbol
      type: object
    AssetUpdate:
      additionalProperties: false
      properties:
        asset_type:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        exchange:
          maxLength: 50
          nullable: true
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    CurrencySummary:
      additionalProperties: false
      properties:
        book_value:
          type: number
        currency:
          type: string
        dividend_income:
          type: number
        realized_pnl:
          type: number
        total_fee:
          type: number
        total_tax:
          type: number
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          description: Error code
          type: integer
        errors:
          additionalProperties: {}
          description: Errors
          type: object
        message:
          description: Error message
          type: string
        status:
          description: Error name
          type: string
      type: object
    Holding:
      additionalProperties: false
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        average_cost:
          description: 1 単位あたりの平均取得単価（手数料込み）
          type: number
        book_value:
          description: 取得原価の合計 = quantity × average_cost
          type: number
        currency:
          type: string
        dividend_income:
          description: 受取配当の累計（税控除後）
          type: number
        first_transaction_at:
          format: date-time
          nullable: true
          type: string
        last_transaction_at:
          format: date-time
          nullable: true
          type: string
        quantity:
          description: 現在の保有数量
          type: number
        realized_pnl:
          description: 売却による実現損益の累計（手数料・税控除後）
          type: number
        total_fee:
          description: 支払手数料の累計
          type: number
        total_tax:
          description: 支払税額の累計
          type: number
        transaction_count:
          type: integer
      type: object
    HoldingsResponse:
      additionalProperties: false
      properties:
        as_of:
          description: この時点までの取引を集計した結果であることを示す
          format: date-time
          type: string
        base_currency:
          type: string
        holdings:
          items:
            $ref: '#/components/schemas/Holding'
          type: array
        summary:
          description: 通貨ごとの集計。異なる通貨は合算しない。
          items:
            $ref: '#/components/schemas/CurrencySummary'
          type: array
      type: object
    PaginationMetadata:
      additionalProperties: false
      properties:
        first_page:
          type: integer
        last_page:
          type: integer
        next_page:
          type: integer
        page:
          type: integer
        previous_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    Transaction:
      additionalProperties: false
      properties:
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          readOnly: true
        asset_id:
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        currency:
          readOnly: true
          type: string
        executed_at:
          format: date-time
          readOnly: true
          type: string
        fee:
          readOnly: true
          type: number
        gross_amount:
          description: 手数料・税を除いた約定金額
          readOnly: true
          type: number
        id:
          readOnly: true
          type: string
        net_amount:
          description: キャッシュフロー。プラスが入金、マイナスが出金。
          readOnly: true
          type: number
        note:
          nullable: true
          readOnly: true
          type: string
        price:
          readOnly: true
          type: number
        quantity:
          readOnly: true
          type: number
        tax:
          readOnly: true
          type: number
        transaction_type:
          enum:
          - BUY
          - SELL
          - DIVIDEND
          - SPLIT
          readOnly: true
        updated_at:
          format: date-time
          readOnly: true
          type: string
      type: object
    TransactionCreate:
      description: '種別ごとの意味:

        - `BUY` / `SELL`: quantity=約定数量, price=単価

        - `DIVIDEND`: quantity は 0、price に配当総額（税引前）を入れる

        - `SPLIT`: quantity に分割比率（1→2 の分割なら 2）、price は 0'
      properties:
        asset_id:
          type: string
        executed_at:
          example: '2026-04-01T00:30:00Z'
          format: date-time
          type: string
        fee:
          default: '0.000000'
          minimum: '0.000000'
          type: number
        note:
          maxLength: 1000
          nullable: true
          type: string
        price:
          default: '0.000000'
          example: '2850.5'
          minimum: '0.000000'
          type: number
        quantity:
          default: '0.0000000000'
          example: '100'
          minimum: '0.0000000000'
          type: number
        tax:
          default: '0.000000'
          minimum: '0.000000'
          type: number
        transaction_type:
          description: '種別ごとの意味:

            - `BUY` / `SELL`: quantity=約定数量, price=単価

            - `DIVIDEND`: quantity は 0、price に配当総額（税引前）を入れる

            - `SPLIT`: quantity に分割比率（1→2 の分割なら 2）、price は 0'
          enum:
          - BUY
          - SELL
          - DIVIDEND
          - SPLIT
      required:
      - asset_id
      - executed_at
      - transaction_type
      type: object
    TransactionUpdate:
      additionalProperties: false
      properties:
        executed_at:
          example: '2026-04-01T00:30:00Z'
          format: date-time
          type: string
        fee:
          example: '550'
          minimum: '0.000000'
          type: number
        note:
          maxLength: 1000
          nullable: true
          type: string
        price:
          example: '2850.5'
          minimum: '0.000000'
          type: number
        quantity:
          example: '100'
          minimum: '0.0000000000'
          type: number
        tax:
          example: '0'
          minimum: '0.000000'
          type: number
        transaction_type:
          enum:
          - BUY
          - SELL
          - DIVIDEND
          - SPLIT
      type: object
    User:
      additionalProperties: false
      properties:
        base_currency:
          description: 集計の基準通貨
          example: JPY
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        display_name:
          readOnly: true
          type: string
        email:
          format: email
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
      type: object
    UserRegister:
      additionalProperties: false
      properties:
        base_currency:
          default: JPY
          example: JPY
          pattern: ^[A-Z]{3}$
          type: string
        display_name:
          example: 山田 太郎
          maxLength: 100
          minLength: 1
          type: string
        email:
          example: investor@example.com
          format: email
          type: string
      required:
      - display_name
      - email
      type: object
    UserRegistered:
      additionalProperties: false
      properties:
        api_key:
          description: 以降のリクエストで X-API-Key ヘッダーに指定する。再表示はできないため必ず保管すること。
          example: pmk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          type: string
        user:
          $ref: '#/components/schemas/User'
      type: object
    UserUpdate:
      additionalProperties: false
      properties:
        base_currency:
          pattern: ^[A-Z]{3}$
          type: string
        display_name:
          maxLength: 100
          minLength: 1
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: ユーザー登録時に払い出される API キー。
      in: header
      name: X-API-Key
      type: apiKey
info:
  contact:
    name: Portfolio Manager Team
  description: '個人向けポートフォリオ管理 API。


    - `assets` … 銘柄マスタ（ユーザーごとに登録）

    - `transactions` … 売買・配当などの取引履歴

    - `holdings` … 取引履歴から算出した保有状況（移動平均法）

    - `user` … 認証中ユーザーのプロフィール


    認証は `X-API-Key` ヘッダーで行う。`POST /api/v1/user/register` のレスポンスで一度だけ API キーが返る。'
  title: Portfolio Manager API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/assets/:
    get:
      parameters:
      - description: 資産種別で絞り込む
        in: query
        name: asset_type
        required: false
        schema:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
      - in: query
        name: currency
        required: false
        schema:
          pattern: ^[A-Z]{3}$
          type: string
      - description: symbol / name の部分一致検索
        in: query
        name: q
        required: false
        schema:
          example: トヨタ
          type: string
      - description: 並び順。先頭に `-` を付けると降順。
        in: query
        name: sort
        required: false
        schema:
          default: symbol
          enum:
          - -asset_type
          - -created_at
          - -name
          - -symbol
          - asset_type
          - created_at
          - name
          - symbol
          example: -created_at
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Asset'
                type: array
          description: OK
          headers:
            X-Pagination:
              $ref: '#/components/headers/PAGINATION'
        '401':
          description: 認証エラー
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 登録済みの銘柄一覧を取得する。
      tags:
      - assets
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: Created
        '401':
          description: 認証エラー
        '409':
          description: 同じ symbol が登録済み
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 銘柄を新規登録する。`symbol` はユーザー内で一意。
      tags:
      - assets
  /api/v1/assets/{asset_id}:
    delete:
      responses:
        '204':
          description: No Content
        '401':
          description: 認証エラー
        '404':
          description: 銘柄が見つからない
        '409':
          description: 取引が紐づいているため削除できない
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 銘柄を削除する。取引が 1 件でも紐づいている場合は削除できない。
      tags:
      - assets
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: OK
        '401':
          description: 認証エラー
        '404':
          description: 銘柄が見つからない
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 銘柄を 1 件取得する。
      tags:
      - assets
    parameters:
    - in: path
      name: asset_id
      required: true
      schema:
        minLength: 1
        type: string
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: OK
        '401':
          description: 認証エラー
        '404':
          description: 銘柄が見つからない
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 銘柄を部分更新する。
      tags:
      - assets
  /api/v1/holdings/:
    get:
      description: '取引を時系列に再生して数量・平均取得単価・実現損益・受取配当を求める。

        `summary` は通貨ごとの合計で、為替レートを持たないため通貨横断の合算はしない。'
      parameters:
      - description: 指定日終了時点の保有状況を算出する（省略時は現在）
        in: query
        name: as_of
        required: false
        schema:
          example: '2026-06-30'
          format: date
          type: string
      - in: query
        name: asset_type
        required: false
        schema:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
      - in: query
        name: currency
        required: false
        schema:
          pattern: ^[A-Z]{3}$
          type: string
      - description: 保有数量が 0 になった銘柄も含めるか
        in: query
        name: include_closed
        required: false
        schema:
          default: false
          type: boolean
      - description: 並び順。先頭に `-` を付けると降順。
        in: query
        name: sort
        required: false
        schema:
          default: -book_value
          enum:
          - -book_value
          - -quantity
          - -realized_pnl
          - -symbol
          - book_value
          - quantity
          - realized_pnl
          - symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingsResponse'
          description: OK
        '401':
          description: 認証エラー
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 現在（または指定日時点）の保有状況を算出して返す。
      tags:
      - holdings
  /api/v1/holdings/{asset_id}:
    get:
      parameters:
      - description: 指定日終了時点の保有状況を算出する（省略時は現在）
        in: query
        name: as_of
        required: false
        schema:
          example: '2026-06-30'
          format: date
          type: string
      - in: query
        name: asset_type
        required: false
        schema:
          enum:
          - STOCK
          - ETF
          - MUTUAL_FUND
          - BOND
          - CRYPTO
          - CASH
          - OTHER
      - in: query
        name: currency
        required: false
        schema:
          pattern: ^[A-Z]{3}$
          type: string
      - description: 保有数量が 0 になった銘柄も含めるか
        in: query
        name: include_closed
        required: false
        schema:
          default: false
          type: boolean
      - description: 並び順。先頭に `-` を付けると降順。
        in: query
        name: sort
        required: false
        schema:
          default: -book_value
          enum:
          - -book_value
          - -quantity
          - -realized_pnl
          - -symbol
          - book_value
          - quantity
          - realized_pnl
          - symbol
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holding'
          description: OK
        '401':
          description: 認証エラー
        '404':
          description: 銘柄が見つからない / 取引が 1 件もない
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 特定銘柄の保有状況を取得する。
      tags:
      - holdings
    parameters:
    - in: path
      name: asset_id
      required: true
      schema:
        minLength: 1
        type: string
  /api/v1/transactions/:
    get:
      description: '`asset_id` / `start_date` / `end_date` で絞り込める。

        日付は UTC 基準で、どちらも指定日を含む（inclusive）。'
      parameters:
      - description: 特定銘柄の取引だけを返す
        in: query
        name: asset_id
        required: false
        schema:
          type: string
      - description: この日付以降（当日を含む）の取引を返す
        in: query
        name: start_date
        required: false
        schema:
          example: '2026-01-01'
          format: date
          type: string
      - description: この日付以前（当日を含む）の取引を返す
        in: query
        name: end_date
        required: false
        schema:
          example: '2026-12-31'
          format: date
          type: string
      - in: query
        name: transaction_type
        required: false
        schema:
          enum:
          - BUY
          - SELL
          - DIVIDEND
          - SPLIT
      - description: 並び順。先頭に `-` を付けると降順。
        in: query
        name: sort
        required: false
        schema:
          default: -executed_at
          enum:
          - -created_at
          - -executed_at
          - created_at
          - executed_at
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Transaction'
                type: array
          description: OK
          headers:
            X-Pagination:
              $ref: '#/components/headers/PAGINATION'
        '401':
          description: 認証エラー
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 取引履歴を検索する。
      tags:
      - transactions
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: Created
        '401':
          description: 認証エラー
        '422':
          description: バリデーションエラー / 銘柄が存在しない
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 取引を登録する。通貨は対象銘柄の設定を引き継ぐ。
      tags:
      - transactions
  /api/v1/transactions/{transaction_id}:
    delete:
      responses:
        '204':
          description: No Content
        '401':
          description: 認証エラー
        '404':
          description: 取引が見つからない
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 取引を削除する。
      tags:
      - transactions
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: OK
        '401':
          description: 認証エラー
        '404':
          description: 取引が見つからない
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 取引を 1 件取得する。
      tags:
      - transactions
    parameters:
    - in: path
      name: transaction_id
      required: true
      schema:
        minLength: 1
        type: string
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: OK
        '401':
          description: 認証エラー
        '404':
          description: 取引が見つからない
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_CONTENT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 取引を部分更新する。銘柄の変更はできない。
      tags:
      - transactions
  /api/v1/user/:
    delete:
      responses:
        '204':
          description: No Content
        '401':
          description: 認証エラー
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
